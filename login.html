<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
<meta name="renderer" content="webkit"/>
<link rel="stylesheet" href="lib/mdui.css">
<script src="lib/theme.js"></script>
<link rel="stylesheet" href="lib/material-icons.css">
<link rel="stylesheet" href="css/common.css">
<title>登录 · Auth Center</title>
</head>
<body>
<button class="theme-toggle fixed" onclick="toggleTheme()" title="切换主题"><mdui-icon id="theme-icon" name="dark_mode--outlined"></mdui-icon></button>

<div class="page active" id="page-login">
  <div class="center-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">A</div>
        <h1>Auth Center</h1>
        <p>统一身份认证 · 一个账号，通行所有应用</p>
      </div>
      <mdui-card class="auth-card" variant="elevated" style="border-radius:24px;">
        <div style="padding:24px;">
          <div class="form-field">
            <mdui-text-field id="login-email" label="邮箱" placeholder="name@example.com" icon="mail--outlined" type="email" clearable full-width></mdui-text-field>
          </div>
          <div class="form-field">
            <mdui-text-field id="login-pass" label="密码" placeholder="请输入密码" icon="lock--outlined" type="password" toggle-password clearable full-width></mdui-text-field>
          </div>
          <div style="text-align:right; margin: 4px 0 16px;">
            <mdui-button variant="text" style="font-size:13px;">忘记密码？</mdui-button>
          </div>
          <mdui-button variant="filled" icon="login" full-width onclick="doLogin()">登 录</mdui-button>
          <div class="divider">其他登录方式</div>
          <div class="socials">
            <mdui-button variant="tonal" full-width onclick="alert('微信登录')">
              <img slot="icon" src="icons/wechat.png" style="width:20px;height:20px;border-radius:50%;">
              <span>微信</span>
            </mdui-button>
            <mdui-button variant="tonal" full-width onclick="alert('QQ登录')">
              <img slot="icon" src="icons/qq.png" style="width:20px;height:20px;border-radius:6px;">
              <span>QQ</span>
            </mdui-button>
            <mdui-button variant="tonal" full-width onclick="alert('GitHub登录')">
              <img slot="icon" src="icons/github.png" style="width:18px;height:18px;border-radius:6px;margin-right:2px;">
              <span>GitHub</span>
            </mdui-button>
          </div>
          <div style="text-align:center; margin-top:18px;">
            <mdui-button variant="text" onclick="location.href='register.html'">还没有账号？立即注册</mdui-button>
          </div>
        </div>
      </mdui-card>
      <div class="foot">© 2026 Auth Center · 登录即代表同意服务条款与隐私政策</div>
    </div>
  </div>
</div>

<script src="lib/mdui.global.js"></script>
<script>
function doLogin() {
  const email = document.getElementById('login-email').value || '';
  const p     = document.getElementById('login-pass').value || '';
  if (!email.trim()) { mdui.snackbar('请输入邮箱'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) { mdui.snackbar('请输入有效的邮箱地址'); return; }
  if (!p) { mdui.snackbar('请输入密码'); return; }
  location.href = 'user/';
}
</script>
</body>
</html>
