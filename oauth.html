<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
<meta name="renderer" content="webkit"/>
<link rel="stylesheet" href="lib/mdui.css">
<script src="lib/theme.js"></script>
<link rel="stylesheet" href="lib/material-icons.css">
<link rel="stylesheet" href="css/common.css">
<title>授权请求 · Auth Center</title>
</head>
<body>
<button class="theme-toggle fixed" onclick="toggleTheme()" title="切换主题"><mdui-icon id="theme-icon" name="dark_mode--outlined"></mdui-icon></button>

<div class="page active" id="page-oauth">
  <div class="center-wrap">
    <div class="auth-card">
      <div class="brand"><div class="logo">A</div><h1>授权请求</h1></div>
      <mdui-card class="auth-card" variant="elevated" style="border-radius:24px;">
        <div style="padding:24px;">
          <div class="oauth-app">
            <div class="app-logo"><mdui-icon name="movie--outlined" style="font-size:26px;"></mdui-icon></div>
            <div>
              <div class="app-name">Verity 影院</div>
              <div class="app-domain">verity.example.com</div>
            </div>
          </div>
          <div class="scope-title">该应用请求获得以下权限：</div>
          <mdui-list>
            <mdui-list-item icon="person--outlined" headline="查看你的基本信息" description="头像、昵称、用户 ID，用于展示登录状态"></mdui-list-item>
            <mdui-list-item icon="folder--outlined" headline="访问你的网盘文件" description="读取和上传文件，用于影片素材存取"></mdui-list-item>
            <mdui-list-item icon="mic--outlined" headline="使用语音服务" description="调用你的 TTS / STT 配额进行语音合成"></mdui-list-item>
            <mdui-list-item icon="notifications--outlined" headline="发送通知" description="向你的设备推送登录与安全提醒"></mdui-list-item>
          </mdui-list>
          <div class="btn-row">
            <mdui-button variant="text" style="color:#ff8a8a;" onclick="deny()">拒 绝</mdui-button>
            <mdui-button variant="filled" icon="check--outlined" onclick="allow()">允 许</mdui-button>
          </div>
          <div class="hint" style="text-align:center;">授权后应用可随时访问以上数据，可在「授权管理」中随时撤回</div>
        </div>
      </mdui-card>
    </div>
  </div>
</div>

<script src="lib/mdui.global.js"></script>
<script>
function allow() {
  mdui.snackbar('授权成功，正在跳转…');
  setTimeout(() => location.href = 'user/', 800);
}
function deny() {
  location.href = 'login.html';
}
</script>
</body>
</html>
