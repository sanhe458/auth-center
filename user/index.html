<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
<meta name="renderer" content="webkit"/>
<link rel="stylesheet" href="../lib/mdui.css">
<script src="../lib/theme.js"></script>
<link rel="stylesheet" href="../lib/material-icons.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/user.css">
<title>控制台 · Auth Center</title>
</head>
<body>

<!-- 顶部导航 -->
<div class="nav">
  <div class="brand-mini" onclick="location.href='../index.html'"><div class="dot">A</div>Auth Center</div>
  <div class="me">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><mdui-icon id="theme-icon" name="dark_mode--outlined"></mdui-icon></button>
    <span style="font-size:13px; opacity:.7;">豁达的金雕</span>
    <mdui-avatar style="--mdui-avatar-size: 34px; background:linear-gradient(135deg,#f59e0b,#ef4444); font-weight:700;">金</mdui-avatar>
  </div>
</div>

<div class="shell">
  <!-- 侧边导航 -->
  <div class="sidebar">
    <div class="nav-item on" onclick="location.href='index.html'"><mdui-icon class="ic" name="dashboard--outlined"></mdui-icon>总览</div>
    <div class="nav-item" onclick="location.href='apps.html'"><mdui-icon class="ic" name="apps--outlined"></mdui-icon>我的应用</div>
    <div class="nav-item" onclick="location.href='keys.html'"><mdui-icon class="ic" name="key--outlined"></mdui-icon>API 密钥</div>
    <div class="nav-item" onclick="location.href='auth.html'"><mdui-icon class="ic" name="verified_user--outlined"></mdui-icon>授权管理</div>
    <div class="nav-item" onclick="location.href='profile.html'"><mdui-icon class="ic" name="person--outlined"></mdui-icon>个人设置</div>
  </div>

  <!-- 内容区 -->
  <div class="content">
    <div class="page-title">总览</div>
    <div class="page-sub">欢迎回来，看看你的账户概况</div>

    <div class="stat-grid">
      <mdui-card class="stat-card" variant="elevated">
        <mdui-icon class="ic" name="apps--outlined"></mdui-icon>
        <div class="num">3</div>
        <div class="lbl">我的应用</div>
      </mdui-card>
      <mdui-card class="stat-card" variant="elevated">
        <mdui-icon class="ic" name="key--outlined"></mdui-icon>
        <div class="num">2</div>
        <div class="lbl">有效密钥</div>
      </mdui-card>
      <mdui-card class="stat-card" variant="elevated">
        <mdui-icon class="ic" name="check_circle--outlined"></mdui-icon>
        <div class="num">2</div>
        <div class="lbl">已授权应用</div>
      </mdui-card>
      <mdui-card class="stat-card" variant="elevated">
        <mdui-icon class="ic" name="trending_up--outlined"></mdui-icon>
        <div class="num">1.2k</div>
        <div class="lbl">今日调用</div>
      </mdui-card>
    </div>

    <div class="sec-title">最近动态</div>
    <mdui-card variant="elevated" style="border-radius:16px;">
      <mdui-list>
        <mdui-list-item icon="key--outlined" headline="生成了新的 API 密钥" description="语音网关 · 2 分钟前"></mdui-list-item>
        <mdui-list-item icon="login--outlined" headline="新设备登录" description="Chrome on Android · 1 小时前"></mdui-list-item>
        <mdui-list-item icon="check_circle--outlined" headline="Verity 影院完成授权" description="基本信息 / 网盘 / 语音 · 今天 14:20"></mdui-list-item>
        <mdui-list-item icon="notifications--outlined" headline="安全提醒：检测到异地登录尝试" description="已拦截 · 昨天 23:11"></mdui-list-item>
      </mdui-list>
    </mdui-card>
  </div>
</div>

<script src="../lib/mdui.global.js"></script>
</body>
</html>
