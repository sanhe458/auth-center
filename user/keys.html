<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
<meta name="renderer" content="webkit"/>
<link rel="stylesheet" href="../lib/mdui.css">
<script src="../lib/theme.js"></script>
<link rel="stylesheet" href="../lib/material-icons.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/user.css">
<title>API 密钥 · Auth Center</title>
</head>
<body>

<div class="nav">
  <div class="brand-mini" onclick="location.href='../index.html'"><div class="dot">A</div>Auth Center</div>
  <div class="me">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><mdui-icon id="theme-icon" name="dark_mode--outlined"></mdui-icon></button>
    <span style="font-size:13px; opacity:.7;">豁达的金雕</span>
    <mdui-avatar style="--mdui-avatar-size: 34px; background:linear-gradient(135deg,#f59e0b,#ef4444); font-weight:700;">金</mdui-avatar>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="nav-item" onclick="location.href='index.html'"><mdui-icon class="ic" name="dashboard--outlined"></mdui-icon>总览</div>
    <div class="nav-item" onclick="location.href='apps.html'"><mdui-icon class="ic" name="apps--outlined"></mdui-icon>我的应用</div>
    <div class="nav-item on" onclick="location.href='keys.html'"><mdui-icon class="ic" name="key--outlined"></mdui-icon>API 密钥</div>
    <div class="nav-item" onclick="location.href='auth.html'"><mdui-icon class="ic" name="verified_user--outlined"></mdui-icon>授权管理</div>
    <div class="nav-item" onclick="location.href='profile.html'"><mdui-icon class="ic" name="person--outlined"></mdui-icon>个人设置</div>
  </div>

  <div class="content">
    <div class="page-title">API 密钥</div>
    <div class="page-sub">为每个应用单独签发密钥，随时吊销</div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
      <mdui-button variant="filled" icon="add--outlined" onclick="location.href='key-create.html'">生成新密钥</mdui-button>
    </div>

    <mdui-list>
      <mdui-list-item nonclickable>
        <mdui-avatar slot="icon" style="--mdui-avatar-size:42px; border-radius:14px; background:rgb(var(--mdui-color-surface-container-high));"><mdui-icon name="key--outlined" style="font-size:20px;"></mdui-icon></mdui-avatar>
        网关主密钥
        <span slot="description" style="font-family:ui-monospace,monospace; font-size:12px;">sk-gw-••••••••••••••••9kNs · 上次使用 2 分钟前</span>
        <mdui-button slot="end-icon" variant="text" icon="delete--outlined" onclick="revoke('网关主密钥')"></mdui-button>
        <span slot="end-icon" class="key-badge ok">有效</span>
      </mdui-list-item>
      <mdui-list-item nonclickable>
        <mdui-avatar slot="icon" style="--mdui-avatar-size:42px; border-radius:14px; background:rgb(var(--mdui-color-surface-container-high));"><mdui-icon name="key--outlined" style="font-size:20px;"></mdui-icon></mdui-avatar>
        Verity 专用密钥
        <span slot="description" style="font-family:ui-monospace,monospace; font-size:12px;">sk-verity-••••••••••••••••4f2a · 上次使用 1 小时前</span>
        <mdui-button slot="end-icon" variant="text" icon="delete--outlined" onclick="revoke('Verity 专用密钥')"></mdui-button>
        <span slot="end-icon" class="key-badge ok">有效</span>
      </mdui-list-item>
      <mdui-list-item nonclickable>
        <mdui-avatar slot="icon" style="--mdui-avatar-size:42px; border-radius:14px; background:rgb(var(--mdui-color-surface-container-high));"><mdui-icon name="lock--outlined" style="font-size:20px;"></mdui-icon></mdui-avatar>
        旧测试密钥
        <span slot="description" style="font-family:ui-monospace,monospace; font-size:12px;">sk-test-••••••••••••••••8c31 · 已于 2026-08-15 吊销</span>
        <span slot="end-icon" class="key-badge off">已吊销</span>
      </mdui-list-item>
    </mdui-list>

    <div id="new-key-area" style="display:none;">
      <div class="sec-title">新密钥已生成</div>
      <mdui-card variant="elevated" style="border-radius:16px;">
        <div style="padding:20px;">
          <div class="token-box">sk-gw-…o5p6</div>
          <div class="hint">密钥只显示一次，请立即保存。生成后无法再次查看。</div>
          <mdui-button variant="filled" icon="content_copy--outlined" full-width onclick="copyKey()" style="margin-top:14px;">复制密钥</mdui-button>
        </div>
      </mdui-card>
    </div>
  </div>
</div>

<script src="../lib/mdui.global.js"></script>
<script>
function genKey() { document.getElementById('new-key-area').style.display = 'block'; }
function copyKey() {
  const t = document.querySelector('#new-key-area .token-box').innerText;
  navigator.clipboard?.writeText(t);
  mdui.snackbar('已复制到剪贴板');
}
function revoke(name) {
  mdui.snackbar(`雏形演示：将吊销「${name}」`);
}
</script>
</body>
</html>
