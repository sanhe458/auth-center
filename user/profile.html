<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
<meta name="renderer" content="webkit"/>
<link rel="stylesheet" href="../lib/mdui.css">
<script src="../lib/theme.js"></script>
<link rel="stylesheet" href="../lib/material-icons.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/user.css">
<title>个人设置 · Auth Center</title>
</head>
<body>

<div class="nav">
  <div class="brand-mini" onclick="location.href='../index.html'"><div class="dot">A</div>Auth Center</div>
  <div class="me">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><mdui-icon id="theme-icon" name="dark_mode--outlined"></mdui-icon></button>
    <span style="font-size:13px; opacity:.7;">豁达的金雕</span>
    <mdui-avatar style="--mdui-avatar-size: 34px; background:linear-gradient(135deg,#f59e0b,#ef4444); font-weight:700;">金</mdui-avatar>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="nav-item" onclick="location.href='index.html'"><mdui-icon class="ic" name="dashboard--outlined"></mdui-icon>总览</div>
    <div class="nav-item" onclick="location.href='apps.html'"><mdui-icon class="ic" name="apps--outlined"></mdui-icon>我的应用</div>
    <div class="nav-item" onclick="location.href='keys.html'"><mdui-icon class="ic" name="key--outlined"></mdui-icon>API 密钥</div>
    <div class="nav-item" onclick="location.href='auth.html'"><mdui-icon class="ic" name="verified_user--outlined"></mdui-icon>授权管理</div>
    <div class="nav-item on" onclick="location.href='profile.html'"><mdui-icon class="ic" name="person--outlined"></mdui-icon>个人设置</div>
  </div>

  <div class="content">
    <div class="page-title">个人设置</div>
    <div class="page-sub">管理你的账号资料与安全</div>

    <div class="sec-title">基本资料</div>
    <mdui-card variant="elevated" style="border-radius:16px;">
      <div style="padding:20px;">
        <div class="form-field"><mdui-text-field id="pf-nickname" label="昵称" value="豁达的金雕" icon="badge--outlined" clearable full-width></mdui-text-field></div>
        <div class="form-field"><mdui-text-field id="pf-email" label="邮箱" value="sanhe@example.com" icon="mail--outlined" type="email" clearable full-width disabled></mdui-text-field></div>
        <mdui-button variant="filled" icon="save--outlined" full-width onclick="saveProfile()">保存修改</mdui-button>
      </div>
    </mdui-card>

    <div class="sec-title">修改密码</div>
    <mdui-card variant="elevated" style="border-radius:16px;">
      <div style="padding:20px;">
        <div class="form-field"><mdui-text-field id="pf-old" label="当前密码" icon="lock--outlined" type="password" toggle-password clearable full-width></mdui-text-field></div>
        <div class="form-field"><mdui-text-field id="pf-new" label="新密码" placeholder="至少 8 位" icon="lock--outlined" type="password" toggle-password clearable full-width></mdui-text-field></div>
        <div class="form-field"><mdui-text-field id="pf-new2" label="确认新密码" icon="lock--outlined" type="password" toggle-password clearable full-width></mdui-text-field></div>
        <mdui-button variant="filled" icon="lock_reset--outlined" full-width onclick="changePass()">更新密码</mdui-button>
      </div>
    </mdui-card>

    <div class="sec-title">其他</div>
    <mdui-card variant="elevated" style="border-radius:16px;">
      <mdui-list>
        <mdui-list-item icon="logout--outlined" headline="退出登录" description="退出当前设备登录状态"></mdui-list-item>
        <mdui-list-item icon="delete_forever--outlined" headline="注销账号" description="永久删除账号及相关数据" style="color:#ff8a8a;"></mdui-list-item>
      </mdui-list>
    </mdui-card>
  </div>
</div>

<script src="../lib/mdui.global.js"></script>
<script>
function saveProfile() {
  const name = document.getElementById('pf-nickname').value || '';
  if (!name.trim()) { mdui.snackbar('昵称不能为空'); return; }
  mdui.snackbar('资料已保存（雏形演示）');
}
function changePass() {
  const old = document.getElementById('pf-old').value || '';
  const n1  = document.getElementById('pf-new').value || '';
  const n2  = document.getElementById('pf-new2').value || '';
  if (!old) { mdui.snackbar('请输入当前密码'); return; }
  if (n1.length < 8) { mdui.snackbar('新密码至少 8 位'); return; }
  if (n1 !== n2) { mdui.snackbar('两次输入的新密码不一致'); return; }
  mdui.snackbar('密码已更新（雏形演示）');
}
</script>
</body>
</html>
