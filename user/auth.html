<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
<meta name="renderer" content="webkit"/>
<link rel="stylesheet" href="../lib/mdui.css">
<script src="../lib/theme.js"></script>
<link rel="stylesheet" href="../lib/material-icons.css">
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/user.css">
<title>授权管理 · Auth Center</title>
</head>
<body>

<div class="nav">
  <div class="brand-mini" onclick="location.href='../index.html'"><div class="dot">A</div>Auth Center</div>
  <div class="me">
    <button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><mdui-icon id="theme-icon" name="dark_mode--outlined"></mdui-icon></button>
    <span style="font-size:13px; opacity:.7;">豁达的金雕</span>
    <mdui-avatar style="--mdui-avatar-size: 34px; background:linear-gradient(135deg,#f59e0b,#ef4444); font-weight:700;">金</mdui-avatar>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="nav-item" onclick="location.href='index.html'"><mdui-icon class="ic" name="dashboard--outlined"></mdui-icon>总览</div>
    <div class="nav-item" onclick="location.href='apps.html'"><mdui-icon class="ic" name="apps--outlined"></mdui-icon>我的应用</div>
    <div class="nav-item" onclick="location.href='keys.html'"><mdui-icon class="ic" name="key--outlined"></mdui-icon>API 密钥</div>
    <div class="nav-item on" onclick="location.href='auth.html'"><mdui-icon class="ic" name="verified_user--outlined"></mdui-icon>授权管理</div>
    <div class="nav-item" onclick="location.href='profile.html'"><mdui-icon class="ic" name="person--outlined"></mdui-icon>个人设置</div>
  </div>

  <div class="content">
    <div class="page-title">授权管理</div>
    <div class="page-sub">查看哪些应用可以访问你的数据，随时撤回</div>

    <div class="sec-title">已授权应用</div>
    <mdui-list>
      <mdui-list-item nonclickable>
        <mdui-avatar slot="icon" style="--mdui-avatar-size:42px; border-radius:14px; background:linear-gradient(135deg,#2dd4bf,#0ea5e9);"><mdui-icon name="movie--outlined" style="font-size:22px;"></mdui-icon></mdui-avatar>
        Verity 影院
        <span slot="description">授权于 2026-08-16 · 基本信息 / 网盘 / 语音</span>
        <mdui-button slot="end-icon" variant="text" style="color:#ff8a8a;" icon="link_off--outlined" onclick="revoke('Verity 影院')">撤回</mdui-button>
        <mdui-badge slot="end-icon" color="tertiary">已授权</mdui-badge>
      </mdui-list-item>
      <mdui-list-item nonclickable>
        <mdui-avatar slot="icon" style="--mdui-avatar-size:42px; border-radius:14px; background:linear-gradient(135deg,#a78bfa,#8b5cf6);"><mdui-icon name="record_voice_over--outlined" style="font-size:22px;"></mdui-icon></mdui-avatar>
        语音网关
        <span slot="description">授权于 2026-08-16 · 语音 / 模型调用</span>
        <mdui-button slot="end-icon" variant="text" style="color:#ff8a8a;" icon="link_off--outlined" onclick="revoke('语音网关')">撤回</mdui-button>
        <mdui-badge slot="end-icon" color="tertiary">已授权</mdui-badge>
      </mdui-list-item>
      <mdui-list-item nonclickable style="opacity:.6;">
        <mdui-avatar slot="icon" style="--mdui-avatar-size:42px; border-radius:14px; background:rgb(var(--mdui-color-surface-container-high));"><mdui-icon name="tv--outlined" style="font-size:22px;"></mdui-icon></mdui-avatar>
        旧版直播助手
        <span slot="description">授权于 2025-11-02 · 已停止维护</span>
        <mdui-badge slot="end-icon">待清理</mdui-badge>
      </mdui-list-item>
    </mdui-list>

    <div class="sec-title">最近登录</div>
    <mdui-card variant="elevated" style="border-radius:16px;">
      <mdui-list>
        <mdui-list-item icon="smartphone--outlined" headline="Chrome on Android" description="湖南常德 · 14:58 · 当前设备"></mdui-list-item>
        <mdui-list-item icon="laptop--outlined" headline="Edge on Windows" description="湖南常德 · 昨天 20:14"></mdui-list-item>
        <mdui-list-item icon="warning--outlined" headline="未知设备（已拦截）" description="广东深圳 · 昨天 23:11 · 密码正确但未通过验证"></mdui-list-item>
      </mdui-list>
    </mdui-card>
  </div>
</div>

<script src="../lib/mdui.global.js"></script>
<script>
function revoke(name) {
  mdui.snackbar(`雏形演示：将撤回「${name}」的授权`);
}
</script>
</body>
</html>
